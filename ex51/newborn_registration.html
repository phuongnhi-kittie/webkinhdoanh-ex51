<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>Newborn Registration</title>
    <link rel="stylesheet" href="newborn_registration.css">
    <script>
        function registerForm() {
        alert("Registration completed successfully!");
        }
        function cancelForm() {
        document.getElementById("registerForm").reset();
        }
    </script>
    </head>
    <body>
    <div class="container">
        <header>
        <h1 align="center">St. Mary’s of Northland Pines</h1>
        <hr/>
        <p align="right">Research Hospital and Clinics</p>
        </header>

        <h2 align="center">Newborn Registration</h2>

        <form id="registerForm">
        <p>Date: <input type="text" placeholder="mm/dd/yy"></p>

        <p>1) Infant’s first name:
            <input type="text"> Last:
            <input type="text">
        </p>

        <p>2) Medical Record #:
            <input type="text">
        </p>

        <p>3) Date of birth:
            <input type="text" placeholder="mm/dd/yy">
        </p>

        <p>4) Birth weight:
            <input type="text">
        </p>

        <p>5) APGAR score:
            <input type="text">
        </p>

        <p>6) Mother’s first name:
            <input type="text"> Last:
            <input type="text">
        </p>

        <p>7) Father’s first name:
            <input type="text"> Last:
            <input type="text">
        </p>

        <p>8) Physician (check all that apply):<br>
            <select multiple size="4">
            <option>Dr. Warren Albert</option>
            <option>Dr. Maria Alvarez</option>
            <option>Dr. Karen Brinkman</option>
            <option>Dr. Micheal Kerry</option>
            </select>
        </p>

        <div class="buttons" align="center">
            <button type="button" onclick="registerForm()">Register</button>
            <button type="button" onclick="cancelForm()">Cancel</button>
        </div>
        </form>
    </div>
    </body>
</html>
